[project]
name = "DSaaS"
description = "Data streams as a service"
version = "0.0.1a"
authors = [
    { name = "Valerie Hayot-Sasson", email = "vhayot@uchicago.edu"    },
    { name = "Sudershan Sridhar",    email = "sudershan@uchicago.edu" }
]
dependencies = [
    "proxystore",
    "requests",
    "pandas",
    "jsonschema",
    "psycopg2",
    "globus_compute_sdk",
    "dill",
    "globus_sdk>=4,<5",
    "globus-cli",
    "fastapi[standard]==0.115.8",
    # Exact: sqlmodel decides what a `datetime` annotation compiles to, and that
    # changed under us between two image builds -- 0.0.4x began mapping a bare
    # `datetime` to a timezone-aware column that rejects naive values, which took
    # registration down until the schema was migrated. The models now name their
    # column types explicitly (aero.models.types.UTCDateTime), so that particular
    # drift cannot recur, but the rest of the schema is still inferred. Move this
    # deliberately, with the tests run against the new version first.
    "sqlmodel==0.0.47"
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "tox",
    "black"
]
server = [
    "flask==2.1.0",
]

[build-system]
# These are the assumed default build requirements from pip:
# https://pip.pypa.io/en/stable/reference/pip/#pep-517-and-518-support
requires = ["setuptools>=43.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["Dockerfiles*", "scripts*", "workflow*"]

[tool.ruff]
extend-select = ["Q"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
omit = [
    "tests/*",
    "aero/database.py",
    #"aero/app/decorators.py",
    #"aero/globus/*",
    "aero/app/utils.py",
]
fail_under = 100
exclude_also = [
    "def search",
    "except ServiceError",
    "except Exception"
]
