# AERO front-door reverse proxy.
#
# Terminates TLS and routes by path prefix to multiple AERO instances on a
# single hostname:
#   https://aero.cels.anl.gov/osprey-proto/...  -> aero1 stack (web alias: aero1-web)
#   https://aero.cels.anl.gov/fhwa/...          -> aero2 stack (web alias: aero2-web)
#   https://aero.cels.anl.gov/hurricane/...     -> aero3 stack (web alias: aero3-web)
#
# Port 80 does nothing but redirect to 443.
#
# Each instance's uvicorn MUST run with a matching --root-path (/fhwa, ...) so
# FastAPI emits correctly-prefixed URLs (Swagger UI at /<prefix>/docs, openapi
# at /<prefix>/openapi.json). See the web service command / ROOT_PATH_ARG in
# docker-compose.yml.
#
# Each instance also needs FORWARDED_ALLOW_IPS set, or uvicorn discards the
# X-Forwarded-Proto below (it trusts only 127.0.0.1 by default, and this nginx
# is a different container) and FastAPI answers an https request with http://
# redirects.
#
# Only ONE nginx runs this config (the front door). Its container must be able
# to resolve aeroN-web -- attach it and the web services to the shared
# "aero-shared" docker network (see docs/running-multiple-instances.md).

# Docker's embedded DNS. Using a resolver + variable upstream lets nginx START
# even when a backend isn't up yet (it 502s at request time instead of failing
# to load the config), which keeps the front door resilient to a stack restart.
resolver 127.0.0.11 valid=30s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name aero.cels.anl.gov;

    # 308 rather than 301: a 301 lets a client re-issue a POST as a GET, which
    # would turn a notify webhook into a silent no-op. 308 keeps the method and
    # body. This protects nothing already sent -- a client configured with
    # http:// has already put its token on the wire by the time it gets here --
    # so clients belong on https:// in their own configuration.
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    # Separate directive: `listen ... http2` is deprecated as of nginx 1.25.
    http2 on;
    server_name aero.cels.anl.gov;

    # The bundle, not the bare leaf -- clients that don't already hold the
    # intermediate can only build a chain if it is served here.
    ssl_certificate     /certs/cels-incommon.anl.gov-bundle.pem;
    ssl_certificate_key /keys/cels.anl.gov-key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    # TLS 1.3 fixes the suite list and 1.2's remaining suites are all adequate,
    # so there is nothing to gain by overriding the client's preference order.
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # No Strict-Transport-Security: it applies to the whole hostname, and once a
    # browser caches it nothing on aero.cels.anl.gov is reachable over http for
    # the lifetime of max-age. Worth adding at a short max-age once TLS has been
    # stable for a while.

    # --- instance 1 --------------------------------------------------------
    location = /osprey-proto { return 308 /osprey-proto/; }
    location /osprey-proto/ {
        set $aero1_web http://aero1-web:8081;
        rewrite ^/osprey-proto/(.*)$ /$1 break;    # strip the /aero1 prefix for the app
        proxy_pass $aero1_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /osprey-proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }

    location = /osprey-proto/adminer { return 308 /osprey-proto/adminer/; }
    location /osprey-proto/adminer/ {
        set $aero1_adminer http://aero1-adminer:8080;
        rewrite ^/osprey-proto/adminer/(.*)$ /$1 break;   # strip prefix; adminer uses relative URLs
        proxy_pass $aero1_adminer;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /osprey-proto/adminer;
    }

    # --- instance 2 --------------------------------------------------------
    location = /fhwa { return 308 /fhwa/; }
    location /fhwa/ {
        set $aero2_web http://aero2-web:8081;
        rewrite ^/fhwa/(.*)$ /$1 break;
        proxy_pass $aero2_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /fhwa;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }

    location = /fhwa/adminer { return 308 /fhwa/adminer/; }
    location /fhwa/adminer/ {
        set $aero2_adminer http://aero2-adminer:8080;
        rewrite ^/fhwa/adminer/(.*)$ /$1 break;
        proxy_pass $aero2_adminer;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /fhwa/adminer;
    }

    # --- instance 3 --------------------------------------------------------
    location = /hurricane { return 308 /hurricane/; }
    location /hurricane/ {
        set $aero3_web http://aero3-web:8081;
        rewrite ^/hurricane/(.*)$ /$1 break;
        proxy_pass $aero3_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /hurricane;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }

    location = /hurricane/adminer { return 308 /hurricane/adminer/; }
    location /hurricane/adminer/ {
        set $aero3_adminer http://aero3-adminer:8080;
        rewrite ^/hurricane/adminer/(.*)$ /$1 break;
        proxy_pass $aero3_adminer;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /hurricane/adminer;
    }
}
